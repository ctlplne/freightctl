name: Native artifact receive browser

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/ci_resources.py'
      - 'scripts/dev-db.py'
      - 'scripts/artifact-exchange-browser.mjs'
      - '.github/workflows/artifact-exchange.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/ci_resources.py'
      - 'scripts/dev-db.py'
      - 'scripts/artifact-exchange-browser.mjs'
      - '.github/workflows/artifact-exchange.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-artifact-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  receive-browser:
    runs-on: ubuntu-24.04
    env:
      FREIGHTCTL_BROWSER_CHANNEL: chrome
      FREIGHTCTL_TEST_ADMIN_FILE: ${{ github.workspace }}/.private/pg-admin.dsn
      FREIGHTCTL_TEST_RUNTIME_FILE: ${{ github.workspace }}/.private/pg-runtime.dsn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Actual native runner and locked browser client
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          google-chrome --version
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          npm --prefix web run check-built
      - name: Task-owned loopback PostgreSQL
        run: python3 scripts/dev-db.py
      - name: Actual recipient UI, exact bytes, unrelated user and endpoint revocation
        run: |
          sh scripts/go.sh test -p 1 -race -timeout=0 -tags=integration,exchangebrowser -run '^(TestExchangeBrowserSummaryRefusesAmbiguousEvidence|TestArtifactExchangeNativeBrowserReceiptWrongActorAndRevocation)$' -count=1 -v ./internal/api
