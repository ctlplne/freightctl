name: Owner-triggered complete foundation replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-foundation:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/freightctl-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Exact browser dependencies and task-owned peers
        run: |
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          node web/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          python3 scripts/dev-db.py
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=pgp-interoperability \
            --tag freightctl-pgp-peer:2.4.9-r1 - <<'DOCKERFILE'
          FROM alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          RUN apk add --no-cache gnupg=2.4.9-r1
          DOCKERFILE
      - name: Complete foundation replay (owner dispatch only)
        run: python3 scripts/qualify-foundation.py
