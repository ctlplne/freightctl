name: Native immutable HTTPS stock resume

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/go.sh"
      - "scripts/dev-db.py"
      - ".github/workflows/http-downloads.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/go.sh"
      - "scripts/dev-db.py"
      - ".github/workflows/http-downloads.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-native-http-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-stock-curl:
    name: Native immutable HTTPS resume (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      FREIGHTCTL_TEST_ADMIN_FILE: ${{ github.workspace }}/.private/pg-admin.dsn
      FREIGHTCTL_TEST_RUNTIME_FILE: ${{ github.workspace }}/.private/pg-runtime.dsn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Actual native stock receiver identity
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
          curl --version
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' curl
          sha256sum /usr/bin/curl
      - name: Task-owned loopback PostgreSQL and ordinary initialization
        run: |
          python3 scripts/dev-db.py
          sh scripts/go.sh run ./cmd/freightctl init
      - name: Actual TLS interruption,curl continuation,exact bytes,namespace and exchange authority
        run: |
          sh scripts/go.sh test -race -timeout=0 -tags=integration,downloadpeer -run '^(TestArtifactHTTP.*|TestArtifactExchangeHTTPSUsesSameCookieAndBearerAuthorityAndSeparateReply)$' -count=1 -v ./internal/api
