name: Native legacy SCP regular-file custody

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/go.sh"
      - "scripts/dev-db.py"
      - ".github/workflows/scp.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/go.sh"
      - "scripts/dev-db.py"
      - ".github/workflows/scp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-native-legacy-scp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-stock-scp:
    name: Native legacy SCP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      FREIGHTCTL_TEST_ADMIN_FILE: ${{ github.workspace }}/.private/pg-admin.dsn
      FREIGHTCTL_TEST_RUNTIME_FILE: ${{ github.workspace }}/.private/pg-runtime.dsn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Actual native OpenSSH client and package identity
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client
          ssh -V
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' openssh-client
          sha256sum /usr/bin/scp /usr/bin/ssh
      - name: Task-owned loopback PostgreSQL and ordinary initialization
        run: |
          python3 scripts/dev-db.py
          sh scripts/go.sh run ./cmd/freightctl init
      - name: Actual stock legacy and modern scp,exact bytes,aborts,current authority and intake
        run: |
          sh scripts/go.sh test -race -timeout=0 -tags=integration,scppeer -run '^(TestLegacySCP|TestSSHSessionSelectorRequiresExplicitTypedCommandAndPreservesSubsystemOnlyDefault|TestSSHTransportOnlyRunsAuthenticatedSFTPAndJoinsShutdown)' -count=1 -v ./internal/api ./internal/sftpd ./internal/crypto
