      - 'scripts/test-ftps-collection-browser.py'
      - 'scripts/ftps-collection-browser.mjs'
      - 'scripts/peers/ftps-source/**'
      - 'scripts/ftps_collection_source.py'
      - 'scripts/test-ftps-collection-source.py'
      - 'scripts/ftps_collection_operator.py'
      - 'scripts/test-ftps-collection-operator.py'
      - 'scripts/ftps-collection-operator-browser.mjs'
      - 'scripts/ftps_collection_metadata.py'
      - 'scripts/test-ftps-collection-metadata.py'
      - 'scripts/metadata_contract.py'
      - 'scripts/ci-metadata-summary.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/test-ci-ftps-summary.py'
      - 'scripts/check-ftp-engine.py'
      - 'scripts/test-ftp-engine.py'
      - '.github/workflows/ftps.yml'
      - '.github/workflows/ftps-browser.yml'
  pull_request:
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/ci_capacity_file.py'
      - 'scripts/test-ci-capacity-file.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/go.sh'
      - 'scripts/prepare-pgp-fixture.py'
      - 'scripts/dev-db.py'
      - 'scripts/ftps-probe.py'
      - 'scripts/ftps-governance-probe.py'
      - 'scripts/ftps_cli_governance.py'
      - 'scripts/ftps_ticket_governance.py'
      - 'scripts/ftps_browser_tickets.py'
      - 'scripts/ftps-ticket-browser.mjs'
      - 'scripts/ftps-operator-browser.mjs'
      - 'scripts/ftps_browser_evidence.py'
      - 'scripts/browser-wire.mjs'
      - 'scripts/browser-native-wire.mjs'
      - 'scripts/test-browser-native-wire.mjs'
      - 'scripts/ftps_contract.py'
      - 'scripts/lftp-probe.py'
      - 'scripts/install-ftps-clients.sh'
      - 'scripts/ftps_dispatch_qualification.py'
      - 'scripts/test-ftps-dispatch-qualification.py'
      - 'scripts/outbound-dispatch-browser.mjs'
      - 'scripts/onboarding-exchange-browser.mjs'
      - '.github/workflows/ftps-dispatch.yml'
      - '.github/workflows/ftps-workflows.yml'
      - 'scripts/qualify-ftps.py'
      - 'scripts/browser-session-proof.mjs'
      - 'scripts/browser_session_evidence.py'
      - 'scripts/test-browser-session-evidence.py'
      - 'scripts/ftps_collection_browser.py'
      - 'scripts/test-ftps-collection-browser.py'
      - 'scripts/ftps-collection-browser.mjs'
      - 'scripts/peers/ftps-source/**'
      - 'scripts/ftps_collection_source.py'
      - 'scripts/test-ftps-collection-source.py'
      - 'scripts/ftps_collection_operator.py'
      - 'scripts/test-ftps-collection-operator.py'
      - 'scripts/ftps-collection-operator-browser.mjs'
      - 'scripts/ftps_collection_metadata.py'
      - 'scripts/test-ftps-collection-metadata.py'
      - 'scripts/metadata_contract.py'
      - 'scripts/ci-metadata-summary.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/test-ci-ftps-summary.py'
      - 'scripts/check-ftp-engine.py'
      - 'scripts/test-ftp-engine.py'
      - '.github/workflows/ftps.yml'
      - '.github/workflows/ftps-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-ftps-workflows-${{ github.workflow }}-${{ github.ref }}
  # Finish the running qualification candidate; newer pushes wait.
  cancel-in-progress: false

jobs:
  workflow-ftps:
    name: Native x86 registered FTPS workflow consent (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [plaintext, recipient-encrypted]
    runs-on: ubuntu-24.04
    env:
      FREIGHTCTL_BROWSER_CHANNEL: chrome
      FREIGHTCTL_FTPS_PROFILE: ${{ matrix.profile }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/freightctl-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
      - name: Native x86 stock peers and exact browser dependencies
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          sh scripts/install-ftps-clients.sh
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          node web/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          npm --prefix web run check-built
      - name: Chromium sandbox preflight
        run: |
          node - <<'NODE'
          const { chromium } = require('./web/node_modules/playwright');
          chromium.launch({ headless: true, chromiumSandbox: true, channel: 'chrome' })
            .then(async browser => {
              console.log('Chrome version: ' + browser.version());
              await browser.close();
            })
            .catch(error => {
              console.error(error.message);
              process.exitCode = 1;
            });
          NODE
      - name: Task-owned PostgreSQL
        run: |
          python3 scripts/dev-db.py
          sh scripts/go.sh run ./cmd/freightctl init
      - name: Pinned task-owned independent recipient fixture
        if: matrix.profile == 'recipient-encrypted'
        run: |
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=pgp-interoperability \
            --tag freightctl-pgp-peer:2.4.9-r1 - <<'DOCKERFILE'
          FROM alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          RUN apk add --no-cache gnupg=2.4.9-r1
          DOCKERFILE
          python3 scripts/prepare-pgp-fixture.py
      - name: Three fresh registered FTPS consent, metadata and operator capture journeys
        run: |
          umask 077
          task_pg_id=$(docker inspect --format '{{.Id}}' freightctl-postgres-v1)
          producer_args=()
          reporter_args=()
          if [ "$FREIGHTCTL_FTPS_PROFILE" = recipient-encrypted ]; then
            producer_args+=(--workflow-dispatch-encryption)
            reporter_args+=(--require-workflow-dispatch-encryption)
          fi
          for qualification_run in 1 2 3; do
            qualification_status=0
            qualification_result=".private/ftps-workflows-result-${qualification_run}.json"
            python3 scripts/qualify-ftps.py --retained-schema "$(python3 scripts/ci-metadata-summary.py --print-schema-version)" --postgres-container-id "$task_pg_id" --workflow-dispatch-approvals --workflow-collection-metadata --workflow-collection-browser --workflow-collection-operator "${producer_args[@]}" > "$qualification_result" || qualification_status=$?
            python3 scripts/ci-ftps-summary.py --result "$qualification_result" --require-workflow-dispatch-approvals --require-workflow-collection-metadata --require-workflow-collection-browser --require-workflow-collection-operator "${reporter_args[@]}"
            if [ "$qualification_status" -ne 0 ]; then
              exit "$qualification_status"
            fi
          done
