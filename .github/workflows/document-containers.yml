name: Native document container contracts

on:
  push:
    branches: [main]
    paths:
      - "internal/zipcontainer/**"
      - "internal/checks/**"
      - "scripts/zip-container-producer.py"
      - "scripts/xlsx-stock-producer.py"
      - "scripts/xlsxwriter-qualification.txt"
      - "scripts/record-projection-native.py"
      - "scripts/go.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/document-containers.yml"
  pull_request:
    paths:
      - "internal/zipcontainer/**"
      - "internal/checks/**"
      - "scripts/zip-container-producer.py"
      - "scripts/xlsx-stock-producer.py"
      - "scripts/xlsxwriter-qualification.txt"
      - "scripts/record-projection-native.py"
      - "scripts/go.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/document-containers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-document-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-zip:
    name: Native ZIP stock producer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Actual runner and stock ZIP producer
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "$(uname -m)" = aarch64
          fi
          umask 077
          mkdir -p .private
          python3 scripts/zip-container-producer.py .private/zip-stock-producer
          printf 'FREIGHTCTL_TEST_ZIP_DIR=%s\n' "$GITHUB_WORKSPACE/.private/zip-stock-producer" >> "$GITHUB_ENV"
      - name: Native parser race and independent producer byte proof
        run: |
          sh scripts/go.sh test -race -timeout=0 -tags=zipnative -count=1 -v ./internal/zipcontainer
          sh scripts/go.sh vet -tags=zipnative ./internal/zipcontainer
      - name: Stock XLSX producer with exact dependency closure
        run: |
          python3 -m venv .private/xlsx-producer
          .private/xlsx-producer/bin/python -m pip install --no-cache-dir --no-deps --no-compile --only-binary=:all: --require-hashes -r scripts/xlsxwriter-qualification.txt
          .private/xlsx-producer/bin/python scripts/xlsx-stock-producer.py .private/xlsx-stock-producer
          printf 'FREIGHTCTL_TEST_XLSX_DIR=%s\n' "$GITHUB_WORKSPACE/.private/xlsx-stock-producer" >> "$GITHUB_ENV"
      - name: Security - actual native XLSX scalar,formula and relationship contracts
        run: |
          sh scripts/go.sh test -race -timeout=0 -tags=xlsxnative -run '^TestXLSXRecords' -count=1 -v ./internal/checks
          sh scripts/go.sh vet -tags=xlsxnative ./internal/checks
      - name: Independent native record-processing producers
        run: |
          umask 077
          python3 scripts/record-projection-native.py prepare .private/record-projection-native
          printf 'FREIGHTCTL_TEST_PROJECTION_DIR=%s\n' "$GITHUB_WORKSPACE/.private/record-projection-native" >> "$GITHUB_ENV"
      - name: Security - native transformation byte and independent receiver contracts
        run: |
          sh scripts/go.sh test -race -timeout=0 -tags=projectionnative -run '^Test(RecordProjection|ProjectionStage|ProjectionIntent|ProjectionAttempt|ProjectionReview|ScopedProjection)' -count=1 -v ./internal/checks
          python3 scripts/record-projection-native.py verify .private/record-projection-native
