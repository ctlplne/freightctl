name: Core correctness and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: freightctl-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/freightctl-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Go formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > "$RUNNER_TEMP/freightctl-gofmt"
          cat "$RUNNER_TEMP/freightctl-gofmt"
          test ! -s "$RUNNER_TEMP/freightctl-gofmt"
      - name: Qualification record refusal contracts
        run: python3 scripts/test-records.py
      - name: Native evidence output refusal contracts
        run: python3 scripts/test-native-evidence.py
      - name: Exact frontend dependencies and browser
        run: |
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          node web/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Dependency audit
        run: npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" audit
      - name: Go vulnerability analysis
        run: sh scripts/go.sh run -p 1 golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./...
      - name: Secret checks on committed source and all history
        run: |
          task_source_snapshot=$(mktemp -d "$RUNNER_TEMP/freightctl-source.XXXXXX")
          git archive HEAD | tar -x -C "$task_source_snapshot"
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 dir "$task_source_snapshot" --redact
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact
      - name: Task-owned PostgreSQL and offline GnuPG peer
        run: |
          python3 scripts/dev-db.py
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=pgp-interoperability \
            --tag freightctl-pgp-peer:2.4.9-r1 - <<'DOCKERFILE'
          FROM alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          RUN apk add --no-cache gnupg=2.4.9-r1
          DOCKERFILE
      - name: Complete implemented core qualification
        run: python3 scripts/qualify-foundation.py
