name: Core correctness and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: freightctl-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Go formatting and workflow syntax
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > "$RUNNER_TEMP/freightctl-gofmt"
          cat "$RUNNER_TEMP/freightctl-gofmt"
          test ! -s "$RUNNER_TEMP/freightctl-gofmt"
          sh scripts/go.sh run -p 1 github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Qualification record refusal contracts
        run: |
          python3 scripts/test-records.py
          python3 scripts/test-native-evidence.py
          python3 scripts/test-ci-summary.py
          python3 scripts/check-records.py
      - name: Exact frontend dependencies, contracts and browser build
        run: |
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          npm --prefix web test
          npm --prefix web run typecheck
          npm --prefix web run check-built
      - name: JavaScript dependency audit
        run: npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" audit
      - name: Go vulnerability reachability
        run: sh scripts/go.sh run -p 1 golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./...
      - name: Committed source and history secret scan
        run: |
          task_source_snapshot=$(mktemp -d "$RUNNER_TEMP/freightctl-source.XXXXXX")
          git archive HEAD | tar -x -C "$task_source_snapshot"
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 dir "$task_source_snapshot" --redact
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact

  native-go-postgres:
    name: Native Go and PostgreSQL (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Verify native runner architecture
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
      - name: Task-owned PostgreSQL and offline GnuPG peer
        run: |
          python3 scripts/dev-db.py
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=pgp-interoperability \
            --tag freightctl-pgp-peer:2.4.9-r1 - <<'DOCKERFILE'
          FROM alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          RUN apk add --no-cache gnupg=2.4.9-r1
          DOCKERFILE
      - name: Module integrity, vet and unit race checks
        run: |
          sh scripts/go.sh mod verify
          sh scripts/go.sh vet -p 1 ./...
          sh scripts/go.sh test -p 1 -race ./...
      - name: All implemented real PostgreSQL integration and migration tests
        run: sh scripts/integration.sh -p 1 -race -v

  bounded-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Bounded parser and authority fuzz checks on native x86_64
        run: |
          test "$(uname -m)" = x86_64
          sh scripts/go.sh test ./internal/vpath -fuzz=FuzzCanonicalPath -fuzztime=5s -parallel=2
          sh scripts/go.sh test ./internal/sftpd -fuzz=FuzzInspectPacket -fuzztime=5s -parallel=2
          sh scripts/go.sh test ./internal/custody -fuzz=FuzzCustodyName -fuzztime=5s -parallel=2
          sh scripts/go.sh test ./internal/workflow -fuzz=FuzzTypedWorkflow -fuzztime=5s -parallel=2
          sh scripts/go.sh test ./internal/checks -fuzz=FuzzCSVContract -fuzztime=5s -parallel=1
          sh scripts/go.sh test ./internal/scanner -fuzz=FuzzClamdRecordAndVersion -fuzztime=5s -parallel=1
          sh scripts/go.sh test ./internal/crypto -fuzz=FuzzPGPAdmission -fuzztime=5s -parallel=1
          sh scripts/go.sh test ./internal/assistance -fuzz=FuzzUntrustedModelOutput -fuzztime=5s -parallel=1

  stock-peer-linux:
    name: Stock peers (${{ matrix.journey }})
    strategy:
      fail-fast: false
      matrix:
        journey: [arrivals-schedules, routing, captured-routing]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/freightctl-playwright
      FREIGHTCTL_BROWSER_CHANNEL: chrome
      FREIGHTCTL_CI_JOURNEY: ${{ matrix.journey }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Stock SSH and exact browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          node web/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Task-owned PostgreSQL
        run: python3 scripts/dev-db.py
      - name: Chromium sandbox preflight
        run: |
          node - <<'NODE'
          const { chromium } = require('./web/node_modules/playwright');
          chromium.launch({ headless: true, chromiumSandbox: true, channel: 'chrome' })
            .then(async browser => {
              console.log('Chrome version: ' + browser.version());
              await browser.close();
              console.log('Chrome sandbox launched on the native Linux runner');
            })
            .catch(error => {
              console.error(error.message);
              process.exitCode = 1;
            });
          NODE
      - name: Real loopback SFTP and browser journey
        run: |
          test "$(uname -m)" = x86_64
          task_pg_id=$(docker inspect --format '{{.Id}}' freightctl-postgres-v1)
          if [ "$FREIGHTCTL_CI_JOURNEY" = captured-routing ]; then
            python3 scripts/qualify-routing.py --postgres-container-id "$task_pg_id" --captured-routing
          elif [ "$FREIGHTCTL_CI_JOURNEY" = routing ]; then
            python3 scripts/qualify-routing.py --postgres-container-id "$task_pg_id"
          else
            python3 scripts/qualify-collections.py --postgres-container-id "$task_pg_id" --backend-only
            python3 scripts/qualify-arrivals.py --postgres-container-id "$task_pg_id" --backend-only
            python3 scripts/qualify-schedules.py --postgres-container-id "$task_pg_id"
          fi
      - name: Safe qualification outcomes and evidence closure
        if: always()
        run: |
          if [ "$FREIGHTCTL_CI_JOURNEY" = captured-routing ]; then
            python3 scripts/ci-qualification-summary.py captured-routing
          elif [ "$FREIGHTCTL_CI_JOURNEY" = routing ]; then
            python3 scripts/ci-qualification-summary.py routing
          else
            python3 scripts/ci-qualification-summary.py collections arrivals schedules
          fi
