name: Core correctness and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: freightctl-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Go formatting and workflow syntax
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > "$RUNNER_TEMP/freightctl-gofmt"
          cat "$RUNNER_TEMP/freightctl-gofmt"
          test ! -s "$RUNNER_TEMP/freightctl-gofmt"
          sh scripts/go.sh run -p 1 github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Qualification record refusal contracts
        run: |
          python3 scripts/check-ftp-engine.py
          python3 scripts/test-ftp-engine.py
          python3 scripts/test-ci-ftps-summary.py
          python3 scripts/test-ftps-dispatch-qualification.py
          python3 scripts/test-ftps-collection-metadata.py
          python3 scripts/test-ftps-collection-browser.py
          python3 scripts/test-browser-session-evidence.py
          python3 scripts/test-ftps-client-summary.py
          python3 scripts/test-ftps-stock-metadata.py
          sh scripts/go.sh test -p 1 -race ./scripts/peers/ftps-source
          python3 scripts/test-ftps-collection-source.py
          python3 scripts/test-ftps-collection-operator.py
          python3 scripts/test-repro-builds.py
          python3 scripts/test-ci-setup-summary.py
          python3 scripts/test-records.py
          python3 scripts/test-native-evidence.py
          python3 scripts/test-ci-summary.py
          python3 scripts/test-retained-metadata.py
          python3 scripts/test-retained-handoff-upgrade.py
          python3 scripts/test-ci-metadata-summary.py
          python3 scripts/test-ci-peer-image-summary.py
          python3 scripts/test-scan-peer-image.py
          python3 scripts/check-records.py
      - name: Exact frontend dependencies, contracts and browser build
        run: |
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          npm --prefix web test
          npm --prefix web run typecheck
          npm --prefix web run check-built
      - name: JavaScript dependency audit
        run: npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" audit
      - name: Go vulnerability reachability
        run: |
          umask 077
          mkdir -p .private .cache/freightctl-govulncheck-1.9.0
          GOBIN="$GITHUB_WORKSPACE/.cache/freightctl-govulncheck-1.9.0" sh scripts/go.sh install -p 1 golang.org/x/vuln/cmd/govulncheck@v1.9.0
          python3 scripts/test-govulncheck-gate.py --tool "$GITHUB_WORKSPACE/.cache/freightctl-govulncheck-1.9.0/govulncheck"
          .cache/freightctl-govulncheck-1.9.0/govulncheck -json ./... > .private/govulncheck.json
          test -s .private/govulncheck.json
          .cache/freightctl-govulncheck-1.9.0/govulncheck -mode=convert -show=version,verbose < .private/govulncheck.json
      - name: Committed source and history secret scan
        run: |
          task_source_snapshot=$(mktemp -d "$RUNNER_TEMP/freightctl-source.XXXXXX")
          git archive HEAD | tar -x -C "$task_source_snapshot"
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 dir "$task_source_snapshot" --redact
          sh scripts/go.sh run -p 1 github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact
