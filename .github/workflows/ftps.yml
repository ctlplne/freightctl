name: Native FTPS stock clients and custody

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/go.sh'
      - 'scripts/dev-db.py'
      - 'scripts/ftps-probe.py'
      - 'scripts/ftps-governance-probe.py'
      - 'scripts/ftps_cli_governance.py'
      - 'scripts/ftps_ticket_governance.py'
      - 'scripts/ftps-operator-browser.mjs'
      - 'scripts/ftps_browser_evidence.py'
      - 'scripts/browser-wire.mjs'
      - 'scripts/ftps_contract.py'
      - 'scripts/lftp-probe.py'
      - 'scripts/install-ftps-clients.sh'
      - 'scripts/qualify-ftps.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/test-ci-ftps-summary.py'
      - 'scripts/check-ftp-engine.py'
      - 'scripts/test-ftp-engine.py'
      - '.github/workflows/ftps.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/go.sh'
      - 'scripts/dev-db.py'
      - 'scripts/ftps-probe.py'
      - 'scripts/ftps-governance-probe.py'
      - 'scripts/ftps_cli_governance.py'
      - 'scripts/ftps_ticket_governance.py'
      - 'scripts/ftps-operator-browser.mjs'
      - 'scripts/ftps_browser_evidence.py'
      - 'scripts/browser-wire.mjs'
      - 'scripts/ftps_contract.py'
      - 'scripts/lftp-probe.py'
      - 'scripts/install-ftps-clients.sh'
      - 'scripts/qualify-ftps.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/test-ci-ftps-summary.py'
      - 'scripts/check-ftp-engine.py'
      - 'scripts/test-ftp-engine.py'
      - '.github/workflows/ftps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-ftps-${{ github.workflow }}-${{ github.ref }}
  # Finish the running qualification candidate; newer pushes wait.
  cancel-in-progress: false

jobs:
  stock-ftps:
    name: Native FTPS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Verify native architecture and stock client TLS
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
          curl --version
          python3 -c 'import ssl; assert ssl.HAS_TLSv1_3; print(ssl.OPENSSL_VERSION)'
      - name: Pinned stock FTPS client
        run: sh scripts/install-ftps-clients.sh
      - name: Task-owned PostgreSQL
        run: |
          python3 scripts/dev-db.py
          sh scripts/go.sh run ./cmd/freightctl init
      - name: Real FTPS service and CLI qualification
        run: |
          umask 077
          task_pg_id=$(docker inspect --format '{{.Id}}' freightctl-postgres-v1)
          qualification_status=0
          python3 scripts/qualify-ftps.py --tickets --postgres-container-id "$task_pg_id" > .private/ftps-result.json || qualification_status=$?
          python3 scripts/ci-ftps-summary.py --require-tickets --result .private/ftps-result.json
          exit "$qualification_status"
