name: Native Linux Go, PostgreSQL and fuzz

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/go.sh'
      - 'scripts/integration.sh'
      - 'scripts/ftps-probe.py'
      - 'scripts/ftps-governance-probe.py'
      - 'scripts/ftps_cli_governance.py'
      - 'scripts/ftps_ticket_governance.py'
      - 'scripts/ftps_browser_tickets.py'
      - 'scripts/ftps-ticket-browser.mjs'
      - 'scripts/ftps_contract.py'
      - 'scripts/lftp-probe.py'
      - 'scripts/install-ftps-clients.sh'
      - 'scripts/qualify-ftps.py'
      - 'scripts/browser-session-proof.mjs'
      - 'scripts/browser_session_evidence.py'
      - 'scripts/test-browser-session-evidence.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/dev-db.py'
      - 'scripts/prepare-pgp-fixture.py'
      - 'scripts/peers/openpgp/**'
      - 'scripts/scan-peer-image.py'
      - 'scripts/ci-peer-image-summary.py'
      - 'scripts/test-ci-peer-image-summary.py'
      - 'scripts/test-scan-peer-image.py'
      - 'scripts/metadata_contract.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/test-retained-metadata.py'
      - 'scripts/ci-metadata-summary.py'
      - 'scripts/test-ci-metadata-summary.py'
      - '.github/workflows/native-linux.yml'
  pull_request:
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/go.sh'
      - 'scripts/integration.sh'
      - 'scripts/ftps-probe.py'
      - 'scripts/ftps-governance-probe.py'
      - 'scripts/ftps_cli_governance.py'
      - 'scripts/ftps_ticket_governance.py'
      - 'scripts/ftps_browser_tickets.py'
      - 'scripts/ftps-ticket-browser.mjs'
      - 'scripts/ftps_contract.py'
      - 'scripts/lftp-probe.py'
      - 'scripts/install-ftps-clients.sh'
      - 'scripts/qualify-ftps.py'
      - 'scripts/browser-session-proof.mjs'
      - 'scripts/browser_session_evidence.py'
      - 'scripts/test-browser-session-evidence.py'
      - 'scripts/ci-ftps-summary.py'
      - 'scripts/dev-db.py'
      - 'scripts/prepare-pgp-fixture.py'
      - 'scripts/peers/openpgp/**'
      - 'scripts/scan-peer-image.py'
      - 'scripts/ci-peer-image-summary.py'
      - 'scripts/test-ci-peer-image-summary.py'
      - 'scripts/test-scan-peer-image.py'
      - 'scripts/metadata_contract.py'
      - 'scripts/qualify-retained-metadata.py'
      - 'scripts/test-retained-metadata.py'
      - 'scripts/ci-metadata-summary.py'
      - 'scripts/test-ci-metadata-summary.py'
      - '.github/workflows/native-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-native-linux-${{ github.workflow }}-${{ github.ref }}
  # Finish the running qualification candidate; newer pushes wait.
  cancel-in-progress: false

jobs:
  native-go-postgres:
    name: Native Go and PostgreSQL (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Verify native runner architecture
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
      - name: Pinned stock FTPS client
        run: |
          sh scripts/install-ftps-clients.sh
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo install -d -m 755 /run/sshd
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' openssh-server openssh-client
      - name: Task-owned PostgreSQL and offline GnuPG peer
        run: |
          python3 scripts/dev-db.py
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=pgp-interoperability \
            --tag freightctl-pgp-peer:2.4.9-r1 - <<'DOCKERFILE'
          FROM alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          RUN apk add --no-cache gnupg=2.4.9-r1
          DOCKERFILE
      - name: Pinned independent AEAD recipient peer
        id: aead_peer
        run: |
          docker build --label "freightctl.workspace=$PWD" \
            --label freightctl.purpose=openpgp-interoperability \
            --label "freightctl.source=$GITHUB_SHA" \
            --tag freightctl-openpgp-peer:6.3.2-r3 scripts/peers/openpgp
      - name: Module integrity, vet and unit race checks
        run: |
          sh scripts/go.sh mod verify
          sh scripts/go.sh vet -p 1 ./...
          sh scripts/go.sh test -timeout=0 -p 1 -race ./...
      - name: Pinned FTP engine upstream protocol and race checks
        run: |
          python3 scripts/check-ftp-engine.py
          sh scripts/go.sh -C third_party/ftpserverlib test -timeout=0 -p 1 -race -count=1 -v ./...
      - name: All implemented real PostgreSQL integration and migration tests
        run: sh scripts/integration.sh -timeout=0 -p 1 -race -v
      - name: Scan the exact independent peer image and enforce complete evidence
        if: ${{ !cancelled() && steps.aead_peer.outcome == 'success' }}
        run: |
          python3 scripts/test-ci-peer-image-summary.py
          python3 scripts/test-scan-peer-image.py
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            python3 scripts/scan-peer-image.py --architecture amd64
          else
            python3 scripts/scan-peer-image.py --architecture arm64
          fi

  metadata-restore:
    name: Native metadata restore (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Seed actual PostgreSQL through first-run commands
        run: |
          test "$(uname -s)" = Linux
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            test "$(uname -m)" = x86_64
          else
            test "${{ matrix.arch }}" = arm64
            test "$(uname -m)" = aarch64
          fi
          umask 077
          python3 scripts/dev-db.py
          sh scripts/go.sh build -p 1 -trimpath -buildvcs=false -o .cache/freightctl-metadata ./cmd/freightctl
          python3 scripts/ci-metadata-summary.py --check-binary .cache/freightctl-metadata
          .cache/freightctl-metadata init
          .cache/freightctl-metadata setup-plan \
            --output .private/metadata-setup.json \
            --token-file .private/metadata.token \
            --storage .private/metadata-custody \
            --tenant-label 'Restore fixture' --partner-label 'Synthetic partner' --admin-label 'Fixture operator'
          .cache/freightctl-metadata setup --request-file .private/metadata-setup.json > .private/metadata-setup-result.json
      - name: Back up, restore and verify exact metadata and access controls
        run: |
          umask 077
          metadata_cid=$(docker inspect --format '{{.Id}}' freightctl-postgres-v1)
          docker stop --time 15 "$metadata_cid" > .private/metadata-preparation-stop.log
          metadata_status=0
          metadata_expected_schema=$(python3 scripts/ci-metadata-summary.py --print-schema-version)
          python3 scripts/qualify-retained-metadata.py --container-id "$metadata_cid" --expected-schema "$metadata_expected_schema" > .private/metadata-result.json || metadata_status=$?
          python3 scripts/ci-metadata-summary.py --result .private/metadata-result.json
          test "$metadata_status" -eq 0

  bounded-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Bounded parser and authority fuzz checks on native x86_64
        run: |
          test "$(uname -m)" = x86_64
          sh scripts/go.sh test -timeout=0 ./internal/vpath -fuzz=FuzzCanonicalPath -fuzztime=5s -parallel=2
          sh scripts/go.sh test -timeout=0 ./internal/sftpd -fuzz=FuzzInspectPacket -fuzztime=5s -parallel=2
          sh scripts/go.sh test -timeout=0 ./internal/ftpsd -fuzz=FuzzActiveDestination -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/ftpsclient -fuzz=FuzzPassiveReplyNeverEscapesPortBudget -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/custody -fuzz=FuzzCustodyName -fuzztime=5s -parallel=2
          sh scripts/go.sh test -timeout=0 ./internal/workflow -fuzz=FuzzTypedWorkflow -fuzztime=5s -parallel=2
          sh scripts/go.sh test -timeout=0 ./internal/checks -fuzz=FuzzCSVContract -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/checks -fuzz=FuzzJSONRecordsContract -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/scanner -fuzz=FuzzClamdRecordAndVersion -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/crypto -fuzz=FuzzPGPAdmission -fuzztime=5s -parallel=1
          sh scripts/go.sh test -timeout=0 ./internal/assistance -fuzz=FuzzUntrustedModelOutput -fuzztime=5s -parallel=1
