name: Native Windows and macOS unit checks

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - go.mod
      - go.sum
      - .gitattributes
      - .github/workflows/native-platforms.yml
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - go.mod
      - go.sum
      - .gitattributes
      - .github/workflows/native-platforms.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Native Windows architecture and Go unit checks
        shell: pwsh
        run: |
          if ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne 'amd64') {
            throw 'Expected native Windows amd64'
          }
          go version
          git ls-files --eol web/THIRD_PARTY_NOTICES.txt internal/browser/assets/manifest.json
          go mod verify
          go vet ./...
          go test ./...

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Native macOS ARM architecture and Go unit race checks
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          go version
          go mod verify
          go vet ./...
          go test -race ./...
