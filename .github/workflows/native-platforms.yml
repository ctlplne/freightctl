name: Native Windows and macOS unit checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - go.mod
      - go.sum
      - .gitattributes
      - 'scripts/peers/windowsfs/**'
      - scripts/qualify-windows-fs.py
      - scripts/test-windows-fs-probe.py
      - .github/workflows/native-platforms.yml
  pull_request:
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - go.mod
      - go.sum
      - .gitattributes
      - 'scripts/peers/windowsfs/**'
      - scripts/qualify-windows-fs.py
      - scripts/test-windows-fs-probe.py
      - .github/workflows/native-platforms.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-2025
    concurrency:
      # Finish each OS's running evidence; a queued Mac cannot hold Windows.
      group: freightctl-native-${{ github.workflow }}-windows-amd64-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: source
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        id: go
        with:
          go-version: "1.26.10"
          cache: false
      - name: Native Windows architecture and Go unit checks
        shell: pwsh
        run: |
          if ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne 'amd64') {
            throw 'Expected native Windows amd64'
          }
          go version
          git ls-files --eol web/THIRD_PARTY_NOTICES.txt internal/browser/assets/manifest.json
          go mod verify
          go vet ./...
          go test -timeout=0 ./...
      - name: Observe native Windows filesystem APIs without qualifying custody
        # Preserve the original unit failure and still collect bounded API facts.
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.go.outcome == 'success' }}
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/qualify-windows-fs.py'], check=True)

  macos-arm64:
    runs-on: macos-15
    concurrency:
      group: freightctl-native-${{ github.workflow }}-macos-arm64-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Native macOS ARM architecture and Go unit race checks
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          go version
          go mod verify
          go vet ./...
          go test -timeout=0 -race ./...
