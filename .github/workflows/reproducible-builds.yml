name: Native reproducible core binaries

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/qualify-repro-builds.py'
      - 'scripts/test-repro-builds.py'
      - 'scripts/core_component_inventory.py'
      - 'scripts/core_go_packages.py'
      - 'scripts/test-core-go-packages.py'
      - 'scripts/test-core-component-inventory.py'
      - 'scripts/core_bom_schema.py'
      - 'scripts/test-core-bom-schema.py'
      - 'scripts/bom-validator-pins.json'
      - 'scripts/bom-validator-requirements.txt'
      - '.github/workflows/reproducible-builds.yml'
  pull_request:
    paths:
      - 'scripts/ci_resources.py'
      - 'scripts/test-ci-resources.py'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/qualify-repro-builds.py'
      - 'scripts/test-repro-builds.py'
      - 'scripts/core_component_inventory.py'
      - 'scripts/core_go_packages.py'
      - 'scripts/test-core-go-packages.py'
      - 'scripts/test-core-component-inventory.py'
      - 'scripts/core_bom_schema.py'
      - 'scripts/test-core-bom-schema.py'
      - 'scripts/bom-validator-pins.json'
      - 'scripts/bom-validator-requirements.txt'
      - '.github/workflows/reproducible-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-reproducible-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-binary:
    name: Native core reproduction (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GOTELEMETRY: "off"
      FREIGHTCTL_REPRO_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Pinned independent BOM validator in an isolated disposable environment
        run: |
          umask 077
          freightctl_schema_env="$RUNNER_TEMP/freightctl-bom-validator"
          test ! -e "$freightctl_schema_env"
          test ! -L "$freightctl_schema_env"
          python3.12 -m venv "$freightctl_schema_env"
          "$freightctl_schema_env/bin/python" -m pip install --isolated --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: --no-deps --index-url https://pypi.org/simple -r scripts/bom-validator-requirements.txt
          "$freightctl_schema_env/bin/python" -m pip check
          "$freightctl_schema_env/bin/python" scripts/test-core-bom-schema.py --real
      - name: Fresh source copies, caches and exact native binary comparison
        run: '"$RUNNER_TEMP/freightctl-bom-validator/bin/python" scripts/qualify-repro-builds.py --architecture "$FREIGHTCTL_REPRO_ARCHITECTURE"'
      # Binaries, module inventories and raw evidence stay ephemeral on runner.
      # Signing, SBOM/bundle completion and artifact distribution are separate.
