name: Stock peer and browser qualification

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - '!cmd/**/*_test.go'
      - 'internal/**'
      - '!internal/**/*_test.go'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/workflows/stock-peers.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - '!cmd/**/*_test.go'
      - 'internal/**'
      - '!internal/**/*_test.go'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/workflows/stock-peers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freightctl-stock-peers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-peer-linux:
    name: Stock peers (${{ matrix.journey }})
    strategy:
      fail-fast: false
      matrix:
        journey: [arrivals-schedules, routing, captured-routing]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 192MiB
      NODE_OPTIONS: --max-old-space-size=192
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/freightctl-playwright
      FREIGHTCTL_BROWSER_CHANNEL: chrome
      FREIGHTCTL_CI_JOURNEY: ${{ matrix.journey }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.0.0"
      - name: Stock SSH and exact browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
          npm --prefix web --cache "$GITHUB_WORKSPACE/.cache/freightctl-npm" ci --ignore-scripts --no-fund
          node web/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Task-owned PostgreSQL
        run: python3 scripts/dev-db.py
      - name: Chromium sandbox preflight
        run: |
          node - <<'NODE'
          const { chromium } = require('./web/node_modules/playwright');
          chromium.launch({ headless: true, chromiumSandbox: true, channel: 'chrome' })
            .then(async browser => {
              console.log('Chrome version: ' + browser.version());
              await browser.close();
              console.log('Chrome sandbox launched on the native Linux runner');
            })
            .catch(error => {
              console.error(error.message);
              process.exitCode = 1;
            });
          NODE
      - name: Real loopback SFTP and browser journey
        run: |
          test "$(uname -m)" = x86_64
          task_pg_id=$(docker inspect --format '{{.Id}}' freightctl-postgres-v1)
          if [ "$FREIGHTCTL_CI_JOURNEY" = captured-routing ]; then
            python3 scripts/qualify-routing.py --postgres-container-id "$task_pg_id" --captured-routing
          elif [ "$FREIGHTCTL_CI_JOURNEY" = routing ]; then
            python3 scripts/qualify-routing.py --postgres-container-id "$task_pg_id"
          else
            python3 scripts/qualify-collections.py --postgres-container-id "$task_pg_id" --backend-only
            python3 scripts/qualify-arrivals.py --postgres-container-id "$task_pg_id" --backend-only
            python3 scripts/qualify-schedules.py --postgres-container-id "$task_pg_id"
          fi
      - name: Safe qualification outcomes and evidence closure
        if: always()
        run: |
          if [ "$FREIGHTCTL_CI_JOURNEY" = captured-routing ]; then
            python3 scripts/ci-qualification-summary.py captured-routing
          elif [ "$FREIGHTCTL_CI_JOURNEY" = routing ]; then
            python3 scripts/ci-qualification-summary.py routing
          else
            python3 scripts/ci-qualification-summary.py collections arrivals schedules
          fi
